name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🔍 Lint & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: 🏷️ TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Monorepo Typecheck (tsc --noEmit)
        run: npm run typecheck

  test:
    name: 🧪 Automated Test Suite (Vitest)
    runs-on: ubuntu-latest
    # Credentials match docker-compose.yml and apps/api/vitest.config.ts exactly, so a
    # test suite that starts exercising real Prisma/Redis calls behaves identically
    # here, in local `docker compose up`, and in `vitest run` outside CI.
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://qforge:qforge_password@localhost:5432/question_forge"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-cryptographically-secure-jwt-secret-key-12345"
      ENABLE_EMBEDDED_WORKERS: "false"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qforge
          POSTGRES_PASSWORD: qforge_password
          POSTGRES_DB: question_forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qforge -d question_forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply Prisma Migrations
        run: npm run db:migrate:deploy

      - name: Run Vitest Suite
        run: npm run test

  build:
    name: ⚡ Monorepo Production Build (Turborepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Turborepo Build
        run: npm run build

  security:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Audit Dependencies for Known CVEs
        run: npm audit --audit-level=critical
        continue-on-error: true
