name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Turborepo)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/qforge_test?sslmode=disable"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-test-cryptographically-secure-jwt-secret-12345"
      ENABLE_EMBEDDED_WORKERS: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Automated Test Suite (Vitest)
        run: npm run test

      - name: Verify Monorepo Builds (Turborepo)
        run: npm run build
