name: Deploy API to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build-and-check:
    name: Pre-Flight Verification (Turborepo)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/qforge_test?sslmode=disable"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-secret-12345"
      ENABLE_EMBEDDED_WORKERS: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Automated Tests
        run: npm run test

      - name: Verify Monorepo Builds
        run: npm run build

  deploy:
    name: Deploy to Production EC2 (Decoupled Containers)
    needs: build-and-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting deployment on Production EC2..."

            # 1. Pull latest code
            if [ ! -d "/home/ubuntu/question-forge" ]; then
              git clone https://github.com/${{ github.repository }}.git /home/ubuntu/question-forge
            fi

            cd /home/ubuntu/question-forge
            PREV_COMMIT=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main

            # 2. Run database migrations BEFORE restarting containers to prevent schema mismatch
            echo "📦 Running database migrations..."
            sudo docker compose -f docker-compose.prod.yml run --rm \
              -e DATABASE_URL="$DATABASE_URL" \
              api npx prisma migrate deploy --schema=packages/shared/prisma/schema.prisma
            echo "✅ Migrations complete."

            # 3. Rolling update: Build and restart decoupled API and Worker containers
            echo "🔄 Rolling out API replicas and dedicated Worker container..."
            sudo docker compose -f docker-compose.prod.yml up -d --build --no-deps api worker

            # 4. Deep Readiness Probe (/health/ready) — verifies DB and Redis connections
            echo "🩺 Probing deep readiness endpoint (/health/ready)..."
            MAX_ATTEMPTS=15
            for i in $(seq 1 $MAX_ATTEMPTS); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health/ready || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "🎉 Production deployment verified on attempt $i (HTTP 200 Ready)"
                exit 0
              fi
              echo "Attempt $i/$MAX_ATTEMPTS: status $HTTP_STATUS — waiting 5s..."
              sleep 5
            done

            echo "🚨 Health check failed after $MAX_ATTEMPTS attempts. Executing automated rollback to $PREV_COMMIT..."
            git reset --hard $PREV_COMMIT
            sudo docker compose -f docker-compose.prod.yml up -d --build api worker
            exit 1
