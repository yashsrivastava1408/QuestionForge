version: '3.9'

# Production overrides — extend docker-compose.yml via:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file assumes Redis and PostgreSQL are externally managed (e.g. AWS RDS + ElastiCache).
# Deploys stateless API replicas, dedicated BullMQ queue workers, and the frontend SPA.
#
# With NODE_ENV=production the API and worker REFUSE TO START unless .env has:
#   JWT_SECRET      32+ random characters      (openssl rand -hex 32)
#   ENCRYPTION_KEY  64 random hex characters   (openssl rand -hex 32)
# and neither ALLOW_MOCK_AUTH=true nor SANDBOX_DRIVER=local is set.
# Exports need S3 (2 API replicas do not share a disk).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # No file watching in production (the image's default CMD is the dev watcher).
    command: ["npm", "run", "start", "--workspace=apps/api"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ENABLE_EMBEDDED_WORKERS=false
    ports:
      - "4000:4000"
    restart: always
    deploy:
      replicas: 2          # Run 2 API replicas — safe now that state is in Redis/PG
      update_config:
        parallelism: 1     # Rolling deploy — update one replica at a time
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Dedicated Background Queue Worker (processes AI generation & outbound webhooks)
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "start:worker", "--workspace=apps/api"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: always
    deploy:
      replicas: 1          # Scale independently based on BullMQ queue depth
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "80:80"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
